<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Album</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        body: ['DM Sans', 'system-ui', 'sans-serif'],
                        display: ['DM Serif Display', 'Georgia', 'serif'],
                    },
                    colors: {
                        cream: { DEFAULT: '#FAFAF7', dark: '#F0EFE9' },
                        ink: { DEFAULT: '#1A1A18', light: '#4A4A45', muted: '#8A8A82' },
                        teal: { DEFAULT: '#0D7377', light: '#E6F3F3', dark: '#095456' },
                        border: { DEFAULT: '#E2E0D8', hover: '#C8C5BA' },
                        error: { DEFAULT: '#B44332', bg: '#FDF2F0' },
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-cream font-body text-ink antialiased">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 border-b border-border bg-cream/90 backdrop-blur-sm">
        <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
            <a class="font-display text-xl text-ink transition-colors hover:text-teal" href="/">
                AI Photo Album
            </a>
            <span class="text-sm text-ink-muted">Captioned by BLIP</span>
        </div>
    </nav>

    <main class="mx-auto max-w-5xl px-6 py-10 space-y-16">

        <!-- Header + Upload -->
        <header>
            <h1 class="font-display text-4xl text-ink md:text-5xl">Photo album</h1>
            <p class="mt-2 text-ink-muted">Upload images and get AI-generated captions automatically.</p>

            <form id="upload-form" class="mt-6">
                <label id="upload-area" class="block border-2 border-dashed border-border rounded-xl p-6 text-center cursor-pointer hover:border-teal/40 hover:bg-teal-light/20 transition-all">
                    <svg class="w-8 h-8 text-ink-muted/60 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                    </svg>
                    <p id="upload-label" class="text-sm text-ink-muted">Click to select an image or drag and drop</p>
                    <p class="text-xs text-ink-muted/50 mt-0.5">JPG, PNG, GIF, WEBP</p>
                    <input type="file" id="file-input" accept="image/*" class="hidden">
                </label>
            </form>

            <!-- Loading -->
            <div id="loading" class="hidden mt-4">
                <div class="flex items-center gap-3 rounded-lg border border-border bg-white px-5 py-3">
                    <div class="h-4 w-4 animate-spin rounded-full border-2 border-teal border-t-transparent"></div>
                    <span class="text-sm text-ink-muted">Generating caption... this may take a moment.</span>
                </div>
            </div>

            <!-- Error -->
            <div id="error" class="hidden mt-4 rounded-lg border border-error/20 bg-error-bg px-5 py-3 text-sm text-error"></div>
        </header>

        <!-- Gallery -->
        <section id="gallery-section" class="hidden space-y-6">
            <div class="flex items-center gap-4">
                <h2 class="font-display text-2xl text-ink">Gallery</h2>
                <span id="photo-count" class="text-sm text-ink-muted"></span>
                <div class="h-px flex-1 bg-border"></div>
            </div>

            <div id="gallery-grid" class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4"></div>
        </section>

    </main>

    <!-- Lightbox Modal -->
    <div id="modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-ink/60 backdrop-blur-sm p-4" onclick="closeModal(event)">
        <div class="relative max-w-3xl w-full rounded-xl border border-border bg-white shadow-xl overflow-hidden" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-3 right-3 z-10 rounded-md bg-ink/10 p-1.5 text-ink-muted transition-colors hover:bg-ink/20 hover:text-ink cursor-pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
            <img id="modal-img" src="" alt="" class="w-full max-h-[70vh] object-contain bg-cream-dark">
            <div class="px-5 py-4 space-y-2">
                <p id="modal-name" class="text-xs text-ink-muted tracking-wide uppercase"></p>
                <p id="modal-caption" class="font-display text-lg text-ink leading-relaxed"></p>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const uploadArea = document.getElementById('upload-area');
        const uploadLabel = document.getElementById('upload-label');
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const gallerySection = document.getElementById('gallery-section');
        const galleryGrid = document.getElementById('gallery-grid');
        const photoCount = document.getElementById('photo-count');
        const modal = document.getElementById('modal');

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('border-teal/40', 'bg-teal-light/20');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('border-teal/40', 'bg-teal-light/20');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-teal/40', 'bg-teal-light/20');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) handleFile(fileInput.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('Please select an image file.');
                return;
            }
            if (file.size > 16 * 1024 * 1024) {
                showError('File size must be less than 16MB.');
                return;
            }

            uploadLabel.textContent = file.name;
            errorEl.classList.add('hidden');
            loadingEl.classList.remove('hidden');

            const formData = new FormData();
            formData.append('file', file);

            fetch('/upload', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    loadingEl.classList.add('hidden');
                    if (data.success) {
                        uploadLabel.textContent = 'Click to select an image or drag and drop';
                        fileInput.value = '';
                        loadGallery();
                    } else {
                        showError(data.error || 'Failed to process image.');
                    }
                })
                .catch(() => {
                    loadingEl.classList.add('hidden');
                    showError('Network error. Please try again.');
                });
        }

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.remove('hidden');
        }

        function loadGallery() {
            fetch('/gallery')
                .then(res => res.json())
                .then(images => {
                    if (images.length === 0) {
                        gallerySection.classList.add('hidden');
                        return;
                    }

                    gallerySection.classList.remove('hidden');
                    photoCount.textContent = images.length + ' photo' + (images.length !== 1 ? 's' : '');

                    galleryGrid.innerHTML = images.map(img => `
                        <div class="group cursor-pointer" onclick="openModal('${img.image}', '${escape(img.caption)}', '${escape(img.filename)}')">
                            <div class="relative overflow-hidden rounded-lg border border-border bg-white shadow-sm transition-shadow hover:shadow-md">
                                <img src="${img.image}" alt="${escape(img.caption)}" class="aspect-square w-full object-cover" loading="lazy">
                                <button onclick="event.stopPropagation(); deleteImage('${img.id}')"
                                    class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity rounded-md bg-ink/30 p-1.5 text-white backdrop-blur-sm hover:bg-error/80 cursor-pointer">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                                    </svg>
                                </button>
                            </div>
                            <p class="mt-2 text-xs leading-relaxed text-ink-muted line-clamp-2">${escape(img.caption)}</p>
                        </div>
                    `).join('');
                });
        }

        function deleteImage(id) {
            if (!confirm('Delete this image?')) return;
            fetch('/gallery/' + id, { method: 'DELETE' })
                .then(() => loadGallery());
        }

        function escape(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Modal
        function openModal(src, caption, name) {
            document.getElementById('modal-img').src = src;
            document.getElementById('modal-caption').textContent = unescape(caption);
            document.getElementById('modal-name').textContent = unescape(name);
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function unescape(str) {
            const div = document.createElement('div');
            div.innerHTML = str.replace(/\\'/g, "'");
            return div.textContent;
        }

        function closeModal(e) {
            if (e && e.target !== modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { modal.classList.add('hidden'); modal.classList.remove('flex'); }
        });

        // Load gallery on page load
        loadGallery();
    </script>

</body>
</html>
