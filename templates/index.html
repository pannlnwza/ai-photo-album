<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Album</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        body: ['DM Sans', 'system-ui', 'sans-serif'],
                        display: ['DM Serif Display', 'Georgia', 'serif'],
                    },
                    colors: {
                        cream: { DEFAULT: '#FAFAF7', dark: '#F0EFE9' },
                        ink: { DEFAULT: '#1A1A18', light: '#4A4A45', muted: '#8A8A82' },
                        teal: { DEFAULT: '#0D7377', light: '#E6F3F3', dark: '#095456' },
                        border: { DEFAULT: '#E2E0D8', hover: '#C8C5BA' },
                        error: { DEFAULT: '#B44332', bg: '#FDF2F0' },
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-cream font-body text-ink antialiased">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 border-b border-border bg-cream/90 backdrop-blur-sm">
        <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
            <a class="font-display text-xl text-ink transition-colors hover:text-teal" href="/">
                AI Photo Album
            </a>
            <span class="text-sm text-ink-muted">Captioned by BLIP</span>
        </div>
    </nav>

    <main class="mx-auto max-w-5xl px-6 py-10 space-y-16">

        <!-- Header -->
        <header>
            <h1 class="font-display text-4xl text-ink md:text-5xl">Photo album</h1>
            <p class="mt-2 text-ink-muted">Upload images and get AI-generated captions automatically.</p>
        </header>

        <!-- Create Album -->
        <section class="space-y-4">
            <div class="flex items-center gap-4">
                <h2 class="font-display text-2xl text-ink">Create an album</h2>
                <div class="h-px flex-1 bg-border"></div>
            </div>
            <form id="create-album-form" class="flex flex-col gap-3 sm:flex-row">
                <input
                    type="text"
                    id="album-name"
                    placeholder="Album name, e.g. Summer Vacation"
                    required
                    class="flex-1 rounded-lg border border-border bg-white px-4 py-2 text-[15px] text-ink placeholder-ink-muted/60 shadow-sm outline-none transition-all focus:border-teal"
                >
                <button
                    type="submit"
                    class="rounded-lg bg-teal px-5 py-2 text-[15px] font-medium text-white shadow-sm transition-all hover:bg-teal-dark hover:cursor-pointer hover:shadow-md active:scale-[0.98]"
                >
                    Create Album
                </button>
            </form>
        </section>

        <!-- Albums -->
        <section id="albums-section" class="hidden space-y-8"></section>

    </main>

    <!-- Lightbox Modal -->
    <div id="modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-ink/60 backdrop-blur-sm p-4" onclick="closeModal(event)">
        <div class="relative max-w-3xl w-full rounded-xl border border-border bg-white shadow-xl overflow-hidden" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-3 right-3 z-10 rounded-md bg-ink/10 p-1.5 text-ink-muted transition-colors hover:bg-ink/20 hover:text-ink cursor-pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
            <img id="modal-img" src="" alt="" class="w-full max-h-[70vh] object-contain bg-cream-dark">
            <div class="px-5 py-4 space-y-2">
                <p id="modal-name" class="text-xs text-ink-muted tracking-wide uppercase"></p>
                <p id="modal-caption" class="font-display text-lg text-ink leading-relaxed"></p>
            </div>
        </div>
    </div>

    <script>
        const albumsSection = document.getElementById('albums-section');
        const modal = document.getElementById('modal');

        // Create album
        document.getElementById('create-album-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('album-name');
            const name = input.value.trim();
            if (!name) return;

            fetch('/albums', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name }),
            })
            .then(res => res.json())
            .then(() => {
                input.value = '';
                loadAlbums();
            });
        });

        function loadAlbums() {
            fetch('/albums')
                .then(res => res.json())
                .then(albums => {
                    if (albums.length === 0) {
                        albumsSection.classList.add('hidden');
                        return;
                    }

                    albumsSection.classList.remove('hidden');
                    albumsSection.innerHTML = albums.map(album => `
                        <div class="space-y-4">
                            <!-- Album header -->
                            <div class="flex items-center gap-4">
                                <h2 class="font-display text-2xl text-ink">${esc(album.name)}</h2>
                                <span class="text-sm text-ink-muted">${album.images.length} photo${album.images.length !== 1 ? 's' : ''}</span>
                                <div class="h-px flex-1 bg-border"></div>
                                <button onclick="deleteAlbum('${album.id}')" class="text-xs font-medium text-error hover:underline cursor-pointer">Delete album</button>
                            </div>

                            <!-- Upload -->
                            <div>
                                <form onsubmit="return false;">
                                    <label class="block border-2 border-dashed border-border rounded-xl p-6 text-center cursor-pointer hover:border-teal/40 hover:bg-teal-light/20 transition-all">
                                        <svg class="w-8 h-8 text-ink-muted/60 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                                        </svg>
                                        <p id="label-${album.id}" class="text-sm text-ink-muted">Click to select an image or drag and drop</p>
                                        <p class="text-xs text-ink-muted/50 mt-0.5">JPG, PNG, GIF, WEBP</p>
                                        <input type="file" accept="image/*" class="hidden" onchange="handleUpload(this, '${album.id}')">
                                    </label>
                                </form>
                                <div id="loading-${album.id}" class="hidden mt-3">
                                    <div class="flex items-center gap-3 rounded-lg border border-border bg-white px-5 py-3">
                                        <div class="h-4 w-4 animate-spin rounded-full border-2 border-teal border-t-transparent"></div>
                                        <span class="text-sm text-ink-muted">Generating caption...</span>
                                    </div>
                                </div>
                                <div id="error-${album.id}" class="hidden mt-3 rounded-lg border border-error/20 bg-error-bg px-5 py-3 text-sm text-error"></div>
                            </div>

                            <!-- Images -->
                            ${album.images.length > 0 ? `
                                <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4">
                                    ${album.images.map(img => `
                                        <div class="group cursor-pointer" onclick="openModal('${img.image}', '${esc(img.caption)}', '${esc(img.filename)}')">
                                            <div class="relative overflow-hidden rounded-lg border border-border bg-white shadow-sm transition-shadow hover:shadow-md">
                                                <img src="${img.image}" alt="${esc(img.caption)}" class="aspect-square w-full object-cover" loading="lazy">
                                                <button onclick="event.stopPropagation(); deleteImage('${album.id}', '${img.id}')"
                                                    class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity rounded-md bg-ink/30 p-1.5 text-white backdrop-blur-sm hover:bg-error/80 cursor-pointer">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                                                    </svg>
                                                </button>
                                            </div>
                                            <p class="mt-2 text-xs leading-relaxed text-ink-muted line-clamp-2">${esc(img.caption)}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `).join('');
                });
        }

        function handleUpload(input, albumId) {
            const file = input.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showAlbumError(albumId, 'Please select an image file.');
                return;
            }

            const label = document.getElementById('label-' + albumId);
            const loading = document.getElementById('loading-' + albumId);
            const errorEl = document.getElementById('error-' + albumId);

            label.textContent = file.name;
            loading.classList.remove('hidden');
            errorEl.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', file);

            fetch('/albums/' + albumId + '/upload', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    loading.classList.add('hidden');
                    if (data.success) {
                        loadAlbums();
                    } else {
                        showAlbumError(albumId, data.error || 'Failed to process image.');
                    }
                })
                .catch(() => {
                    loading.classList.add('hidden');
                    showAlbumError(albumId, 'Network error. Please try again.');
                });
        }

        function showAlbumError(albumId, msg) {
            const el = document.getElementById('error-' + albumId);
            if (el) { el.textContent = msg; el.classList.remove('hidden'); }
        }

        function deleteAlbum(id) {
            if (!confirm('Delete this album and all its photos?')) return;
            fetch('/albums/' + id, { method: 'DELETE' }).then(() => loadAlbums());
        }

        function deleteImage(albumId, imageId) {
            if (!confirm('Delete this image?')) return;
            fetch('/albums/' + albumId + '/images/' + imageId, { method: 'DELETE' }).then(() => loadAlbums());
        }

        function esc(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Modal
        function openModal(src, caption, name) {
            document.getElementById('modal-img').src = src;
            document.getElementById('modal-caption').textContent = unesc(caption);
            document.getElementById('modal-name').textContent = unesc(name);
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function unesc(str) {
            const div = document.createElement('div');
            div.innerHTML = str.replace(/\\'/g, "'");
            return div.textContent;
        }

        function closeModal(e) {
            if (e && e.target !== modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { modal.classList.add('hidden'); modal.classList.remove('flex'); }
        });

        // Load on page load
        loadAlbums();
    </script>

</body>
</html>
